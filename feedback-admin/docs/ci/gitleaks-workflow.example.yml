# GitHub Actions workflow that runs the same gitleaks scan on every PR
# as a backstop, in case someone bypasses the local pre-commit hook
# with `git commit --no-verify`.
#
# WHY THIS FILE LIVES HERE INSTEAD OF .github/workflows/:
# Our git automation account currently does not have the `workflow`
# OAuth scope, so it cannot push files into `.github/workflows/`. To
# enable this CI check, copy this file manually:
#
#   mkdir -p .github/workflows
#   cp docs/ci/gitleaks-workflow.example.yml .github/workflows/gitleaks.yml
#   git add .github/workflows/gitleaks.yml
#   git commit -m "ci: enable gitleaks scan on PRs"
#   git push
#
# Or just create it via the GitHub web UI:
# repo → Actions → New workflow → set up a workflow yourself → paste this.

name: gitleaks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "devin/1777397957-feedback-mini-app"

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: Scan for secrets and infra leaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so the scan covers the whole PR diff, not
          # just the latest commit.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the repo's own .gitleaks.toml (custom rules + allowlist).
          GITLEAKS_CONFIG: .gitleaks.toml
          # The action enables --redact by default; no extra flags needed.
