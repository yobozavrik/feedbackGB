name: gitleaks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "devin/1777397957-feedback-mini-app"

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: Scan for secrets and infra leaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so the scan covers the whole PR diff, not
          # just the latest commit.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the repo's own .gitleaks.toml (custom rules + allowlist).
          GITLEAKS_CONFIG: .gitleaks.toml
          # The action enables --redact by default; no extra flags needed.
